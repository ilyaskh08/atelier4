[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logiai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "scikit-learn>=1.3",
    "joblib",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "build>=1.2",
]

[project.scripts]
logiai-predict = "logiai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["logiai*"]
